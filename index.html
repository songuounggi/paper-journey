<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F3EEFF" />
  <title>보리를 찾아서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 메인 무대 (360 x 640 좌표계) -->
    <svg id="stage" viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice">
      <defs>
        <!-- 엘리베이션: 멀수록 그림자가 얕고, 가까울수록 깊다. 위쪽 가장자리에 빛 반사 -->
        <filter id="e1" x="-10%" y="-10%" width="120%" height="140%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b" />
          <feOffset in="b" dy="3" result="o" />
          <feFlood flood-color="#6B5A9E" flood-opacity="0.10" />
          <feComposite in2="o" operator="in" result="s" />
          <feMerge><feMergeNode in="s" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="paper" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b1" />
          <feOffset in="b1" dy="6" result="o1" />
          <feFlood flood-color="#6B5A9E" flood-opacity="0.16" />
          <feComposite in2="o1" operator="in" result="s1" />
          <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="b2" />
          <feOffset in="b2" dy="1.5" result="o2" />
          <feFlood flood-color="#4A3F6B" flood-opacity="0.14" />
          <feComposite in2="o2" operator="in" result="s2" />
          <feOffset in="SourceAlpha" dy="2" result="sh" />
          <feComposite in="SourceAlpha" in2="sh" operator="out" result="rim" />
          <feFlood flood-color="#FFFFFF" flood-opacity="0.6" />
          <feComposite in2="rim" operator="in" result="hl" />
          <feMerge><feMergeNode in="s1" /><feMergeNode in="s2" /><feMergeNode in="SourceGraphic" /><feMergeNode in="hl" /></feMerge>
        </filter>
        <filter id="e3" x="-25%" y="-25%" width="150%" height="180%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="b1" />
          <feOffset in="b1" dy="10" result="o1" />
          <feFlood flood-color="#6B5A9E" flood-opacity="0.22" />
          <feComposite in2="o1" operator="in" result="s1" />
          <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="b2" />
          <feOffset in="b2" dy="2.5" result="o2" />
          <feFlood flood-color="#4A3F6B" flood-opacity="0.16" />
          <feComposite in2="o2" operator="in" result="s2" />
          <feOffset in="SourceAlpha" dy="2.5" result="sh" />
          <feComposite in="SourceAlpha" in2="sh" operator="out" result="rim" />
          <feFlood flood-color="#FFFFFF" flood-opacity="0.7" />
          <feComposite in2="rim" operator="in" result="hl" />
          <feMerge><feMergeNode in="s1" /><feMergeNode in="s2" /><feMergeNode in="SourceGraphic" /><feMergeNode in="hl" /></feMerge>
        </filter>
        <!-- 종이 뒷면 (넘겼을 때) -->
        <filter id="backside" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b" />
          <feOffset in="b" dy="8" result="bo" />
          <feFlood flood-color="#6B5A9E" flood-opacity="0.22" />
          <feComposite in2="bo" operator="in" result="sh" />
          <feFlood flood-color="#FFFBF5" result="f" />
          <feComposite in="f" in2="SourceAlpha" operator="in" result="sil" />
          <feMerge><feMergeNode in="sh" /><feMergeNode in="sil" /></feMerge>
        </filter>

        <!-- 하늘 / 언덕 그라데이션 -->
        <linearGradient id="skyMorning" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#DCE8FF" /><stop offset=".55" stop-color="#F6EEFF" /><stop offset="1" stop-color="#FFEFF4" />
        </linearGradient>
        <linearGradient id="skyMint" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D6F1FF" /><stop offset=".6" stop-color="#EEF9FF" /><stop offset="1" stop-color="#F3FFF7" />
        </linearGradient>
        <linearGradient id="skySunset" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E9DDFF" /><stop offset=".5" stop-color="#FFE3EE" /><stop offset="1" stop-color="#FFF0DE" />
        </linearGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#E2F4E9" /><stop offset="1" stop-color="#CDEBD9" />
        </linearGradient>
        <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#CBEEDA" /><stop offset="1" stop-color="#B3E2C8" />
        </linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#B9E8CF" /><stop offset="1" stop-color="#9FDABB" />
        </linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#A9D8F2" /><stop offset=".5" stop-color="#CBEAFA" /><stop offset="1" stop-color="#A9D8F2" />
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0" stop-color="#FFF4D6" stop-opacity=".9" /><stop offset="1" stop-color="#FFF4D6" stop-opacity="0" />
        </radialGradient>
      </defs>
      <g id="scene"></g>
      <g id="hud"></g>
      <g id="fly"></g>
    </svg>

    <button id="mute" aria-label="소리 켜기/끄기">🔊</button>
    <div id="hint"></div>
    <div id="toast"></div>
    <div id="banner"></div>

    <!-- 타이틀 -->
    <div id="title" class="layer">
      <div class="title-text">
        <small>종이로 만든 세상 속 작은 여행</small>
        <h1>보리를 찾아서</h1>
      </div>
      <div id="titleArt"></div>
      <button id="startBtn" class="btn">여행 시작하기</button>
      <p class="title-tip">끌고, 당기고, 접어서 보리의 흔적을 찾아요</p>
    </div>

    <!-- 주인공 선택 -->
    <div id="select" class="layer hidden">
      <small class="sel-sub">함께 떠날 주인공</small>
      <h2 class="sel-title">누구랑 보리를 찾으러 갈까?</h2>
      <div class="sel-stage"><svg id="selPreview" viewBox="12 70 176 156"></svg></div>
      <h3 id="selName"></h3>
      <p id="selDesc"></p>
      <div id="selList"></div>
      <button id="selGo" class="btn">이 친구로 출발!</button>
    </div>

    <!-- 종이접기 -->
    <div id="origami" class="layer hidden">
      <div class="ori-head">
        <div class="ori-badge">종이접기 시간</div>
        <h2 id="oriTitle"></h2>
        <div id="oriStep"></div>
      </div>
      <div class="ori-stage">
        <div class="ori-spot"></div>
        <svg id="oriSvg" viewBox="-1.5 -1.5 3 3"></svg>
      </div>
      <p id="oriText"></p>
      <button id="oriNext" class="btn hidden">계속하기</button>
    </div>

    <!-- 엔딩 -->
    <div id="ending" class="layer hidden">
      <small class="end-sub">CHAPTER 1 · 종이 숲</small>
      <h1>챕터 클리어!</h1>
      <div class="end-card">
        <div class="end-label">내가 접은 종이접기</div>
        <div id="endAlbum"></div>
      </div>
      <div class="end-card">
        <div class="end-label">찾은 보리의 흔적</div>
        <div id="endItems"></div>
      </div>
      <p class="end-teaser">발자국은 <b>바다</b> 쪽으로 이어져 있다…<br>보리야, 조금만 기다려!</p>
      <small class="end-soon">CHAPTER 2 · 종이 바다 — 준비 중</small>
      <button id="restartBtn" class="btn">처음부터 다시</button>
    </div>

    <div id="pageturn" class="hidden"></div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/fold.js"></script>
  <script src="js/art.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/origami.js"></script>
  <script src="js/book.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
